name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # A wedged --all-features build otherwise burns the full 6h per-job maximum
    # before GitHub cancels it (that is exactly how the ubuntu leg failed on
    # 8617e45). macOS, the slowest healthy leg, does build+test in ~61 min.
    timeout-minutes: 120

    env:
      # The page-file bump below fixes the linker's rlib mmap, but rustc itself
      # then OOMs ("memory allocation of N bytes failed") emitting full debuginfo
      # for the final --all-features `vapor` crate on the Windows runner. Linux
      # hits the same wall from the other side: full debuginfo for ~102 SDK
      # crates plus the test binaries overruns the runner's root partition. Only
      # macOS, with the roomiest disk-to-workload ratio, keeps dev debuginfo.
      CARGO_PROFILE_DEV_DEBUG: ${{ matrix.os == 'macos-latest' && '2' || '0' }}
      CARGO_PROFILE_TEST_DEBUG: ${{ matrix.os == 'macos-latest' && '2' || '0' }}

    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Free disk space
      # Same reclaim docs.yml and the coverage job do: --all-features builds all
      # ~102 AWS SDK crates, and here their test binaries on top. Without this
      # the ubuntu leg never finishes; with it, docs.yml compiles the identical
      # dependency graph from a cold cache in ~23 min.
      if: runner.os == 'Linux'
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force
        df -h /

    - name: Increase Windows page file
      # Linking all ~102 AWS SDK crates under --all-features exhausts the
      # Windows runner's default page file, failing with os error 1455
      # ("The paging file is too small") on rlib mmap. ubuntu/macOS are fine.
      if: runner.os == 'Windows'
      uses: al-cheb/configure-pagefile-action@a3b6ebd6b634da88790d9c58d4b37a7f4a7b8708 # v1.4
      with:
        minimum-size: 8GB
        maximum-size: 16GB
        disk-root: "C:"

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      with:
        toolchain: stable

    - name: Cache Rust build artifacts
      uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
      with:
        # rust-cache only saves on success by default, so a failing leg starts
        # every subsequent run from a cold cache and stays slow enough to keep
        # failing. Saving partial artifacts breaks that loop.
        cache-on-failure: true

    - name: Build
      run: cargo build --all-features --verbose

    - name: Run tests
      run: cargo test --all-features --verbose

  feature-sets:
    name: Feature sets
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      with:
        toolchain: stable

    - name: Check default features
      run: cargo check --verbose

    - name: Check release feature set
      run: cargo check --no-default-features --features release --verbose

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      with:
        toolchain: stable
        components: rustfmt, clippy

    - name: Cache Rust build artifacts
      uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8

    - name: Check formatting
      run: cargo fmt --all --check

    - name: Clippy
      run: cargo clippy --all-features --all-targets -- -D warnings

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      # Coverage mapping is emitted by -C instrument-coverage, independent of
      # DWARF, so llvm-cov needs no debuginfo — and dropping it keeps the
      # instrumented build (bigger than a plain one) inside the runner's disk
      # and memory budget. The uninstrumented run died mid-step at ~57 min with
      # no logs retained, the signature of a runner lost to resource pressure.
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'

    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Free disk space
      # --all-features builds all ~102 AWS SDK crates, then instruments and
      # rebuilds them for coverage; see docs.yml for the same tradeoff with
      # the runner's default free space.
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force
        df -h /

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      with:
        toolchain: stable
        components: llvm-tools-preview

    - name: Cache Rust build artifacts
      uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
      with:
        cache-on-failure: true

    - name: Install cargo-llvm-cov
      uses: taiki-e/install-action@16b05812d776ae1dfaabc8277e421fb6d2506419 # v2
      with:
        tool: cargo-llvm-cov

    - name: Run instrumented tests
      # Collect profile data once, then generate both reports from it below
      # rather than re-running the (expensive, --all-features) test suite
      # per report format.
      run: cargo llvm-cov --all-features --no-report

    - name: Generate coverage summary
      # Baseline measured at 98.15% (2026-07-23) on a suite that is almost all
      # mechanical From<SdkType> conversions, so coverage is cheap and runs high.
      # Gate set at 95 (not 98) so routine refactors and clippy autofixes can't
      # tip a thin margin and turn CI red; the security-critical auth paths in
      # server.rs are guarded by dedicated behavior tests, not this percentage.
      run: cargo llvm-cov report --summary-only --json --output-path coverage.json --fail-under-lines 95

    - name: Generate HTML report
      run: cargo llvm-cov report --html

    - name: Upload HTML report
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: coverage-html
        path: target/llvm-cov/html